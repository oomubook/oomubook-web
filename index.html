<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OomuBook 輕約美業預約平台 | 雲端多租戶系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 固定的圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-white font-bold text-lg shadow-md">
                    Oo
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide bg-gradient-to-r from-rose-600 to-pink-500 bg-clip-text text-transparent">OomuBook</h1>
                    <p class="text-xs text-slate-400">輕約美業預約平台 (雲端同步版)</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openCustomerPortal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-rose-600 transition">
                    <i class="fa-solid fa-store mr-1.5"></i>顧客進入
                </button>
                <button onclick="openShopLoginModal()" class="px-4 py-2 text-sm font-medium bg-rose-600 text-white rounded-xl shadow-sm hover:bg-rose-700 transition">
                    <i class="fa-solid fa-lock mr-1.5"></i>店家登入 / 註冊
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- 首頁：店家清單展示 -->
        <div id="home-view" class="space-y-6">
            <div class="bg-gradient-to-r from-rose-500 to-pink-500 rounded-2xl p-8 text-white shadow-lg">
                <h2 class="text-3xl font-bold mb-2">無人化預約，讓美業經營更輕鬆</h2>
                <p class="text-rose-100 text-sm max-w-xl">全台首創多租戶獨立美業預約系統。告別繁瑣人工對話，自動防撞時段、手機黑名單攔截、線上定金與獨立後台管理。</p>
            </div>

            <div class="flex justify-between items-center mt-8">
                <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-shops mr-2 text-rose-500"></i>線上預約合作美業店家</h3>
                <span id="shop-count-badge" class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-medium">載入雲端店家清單中...</span>
            </div>

            <!-- 店家列表網格 -->
            <div id="public-shops-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 動態載入店家 -->
            </div>
        </div>

        <!-- 顧客預約頁面 (點入特定店家後顯示) -->
        <div id="customer-booking-view" class="hidden space-y-6">
            <button onclick="goHome()" class="text-sm text-slate-500 hover:text-rose-600 font-medium flex items-center mb-4">
                <i class="fa-solid fa-arrow-left mr-2"></i>返回所有店家
            </button>
            <div id="customer-shop-banner" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex justify-between items-center">
                <!-- 店家標題與公告 -->
            </div>
            <!-- 預約行事曆與步驟 -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <h3 class="font-bold text-lg mb-4 text-slate-700">選擇預約日期與時段</h3>
                <div id="booking-calendar-container">
                    <!-- 預約互動介面 -->
                </div>
            </div>
        </div>

        <!-- 店家管理後台 (登入後顯示) -->
        <div id="shop-admin-view" class="hidden space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full font-semibold">雲端同步後台</span>
                    <h2 id="admin-shop-title" class="text-2xl font-bold text-slate-800 mt-1">載入中...</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="previewShopPage()" class="px-4 py-2 text-sm font-medium bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition">
                        <i class="fa-solid fa-eye mr-1.5"></i>預覽顧客頁面
                    </button>
                    <button onclick="logoutShop()" class="px-4 py-2 text-sm font-medium bg-rose-50 text-rose-600 rounded-xl hover:bg-rose-100 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1.5"></i>登出
                    </button>
                </div>
            </div>

            <!-- 後台分頁按鈕 -->
            <div class="flex space-x-2 border-b border-slate-200 pb-2 overflow-x-auto">
                <button onclick="switchAdminTab('services')" class="admin-tab-btn px-4 py-2 text-sm font-semibold rounded-xl bg-rose-600 text-white transition">服務與公告管理</button>
                <button onclick="switchAdminTab('slots')" class="admin-tab-btn px-4 py-2 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition">時段與預約訂單</button>
                <button onclick="switchAdminTab('accounting')" class="admin-tab-btn px-4 py-2 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-100 transition">記帳與營收報表</button>
            </div>

            <!-- 分頁內容 -->
            <div id="admin-tab-content" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 min-h-[400px]">
                <!-- 動態載入後台內容 -->
            </div>
        </div>

    </main>

    <!-- 店家登入與註冊彈窗 Modal -->
    <div id="shop-login-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
            <button onclick="closeShopLoginModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <!-- 登入表單 -->
            <div id="login-form-container">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800">店家專屬後台登入</h3>
                    <p class="text-xs text-slate-400 mt-1">輸入您的帳號密碼管理預約與雲端資料</p>
                </div>
                <form onsubmit="handleShopLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">登入帳號</label>
                        <input type="text" id="login-username" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">登入密碼</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                    </div>
                    <button type="submit" class="w-full py-3 bg-rose-600 text-white rounded-xl font-semibold shadow-md hover:bg-rose-700 transition">立即登入後台</button>
                </form>
                <div class="text-center mt-6">
                    <p class="text-xs text-slate-500">還沒有店家帳號？ 
                        <button onclick="toggleRegisterMode(true)" class="text-rose-600 font-semibold hover:underline">立即免費註冊</button>
                    </p>
                </div>
            </div>

            <!-- 註冊表單 -->
            <div id="register-form-container" class="hidden">
                <div class="text-center mb-4">
                    <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                        <i class="fa-solid fa-store"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800">註冊美業店家帳號</h3>
                    <p class="text-xs text-slate-400">享有前兩個月免費試用，立即建立專屬預約系統</p>
                </div>
                <form onsubmit="handleShopRegister(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">工作室／店家名稱</label>
                        <input type="text" id="reg-shopname" required placeholder="例：沐光微醺美學" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">負責人姓名</label>
                            <input type="text" id="reg-owner" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">手機號碼</label>
                            <input type="tel" id="reg-phone" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">電子信箱 (Email)</label>
                        <input type="email" id="reg-email" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">自訂登入帳號</label>
                            <input type="text" id="reg-username" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">自訂登入密碼</label>
                            <input type="password" id="reg-password" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-500 text-sm">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-rose-600 to-pink-500 text-white rounded-xl font-semibold shadow-md hover:opacity-90 transition mt-2">確認註冊並開啟免費體驗</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-xs text-slate-500">已經有帳號了？ 
                        <button onclick="toggleRegisterMode(false)" class="text-rose-600 font-semibold hover:underline">返回登入</button>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- 頁尾與管理員隱藏入口 -->
    <footer class="mt-auto py-6 border-t border-slate-200 text-center text-xs text-slate-400">
        <p>&copy; 2026 OomuBook 輕約美業預約平台. All rights reserved. <span onclick="triggerAdminSecret()" class="cursor-pointer hover:text-rose-600 ml-1">✦</span></p>
    </footer>

    <!-- Firebase 雲端資料庫 SDK 串接與核心邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 您的專屬 Firebase 雲端金鑰設定
        const firebaseConfig = {
            apiKey: "AIzaSyCRyyFuTR7pWLKMrMBOzGMu1_DdjtJCQ",
            authDomain: "oomubook-system-dbc11.firebaseapp.com",
            projectId: "oomubook-system-dbc11",
            storageBucket: "oomubook-system-dbc11.appscore.app",
            messagingSenderId: "330383784221",
            appId: "1:330383784221:web:1a0323f211276c191609f4",
            measurementId: "G-D3K6N7ZZ2Y"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 將 db 與 firebase 方法掛載至全域變數供下方函式使用
        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;
        window.query = query;
        window.where = where;

        // 頁面載入完成後自動抓取雲端店家清單
        window.addEventListener('DOMContentLoaded', () => {
            loadPublicShops();
        });
    </script>

    <script>
        let currentLoggedInShop = null; // 目前登入的店家物件
        let currentViewingShopId = null; // 目前顧客正在瀏覽的店家ID

        // 切換視圖
        function goHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('customer-booking-view').classList.add('hidden');
            document.getElementById('shop-admin-view').classList.add('hidden');
            loadPublicShops();
        }

        function openCustomerPortal() {
            goHome();
        }

        // 開啟登入彈窗
        function openShopLoginModal() {
            document.getElementById('shop-login-modal').classList.remove('hidden');
            toggleRegisterMode(false);
        }

        function closeShopLoginModal() {
            document.getElementById('shop-login-modal').classList.add('hidden');
        }

        function toggleRegisterMode(isRegister) {
            if (isRegister) {
                document.getElementById('login-form-container').classList.add('hidden');
                document.getElementById('register-form-container').classList.remove('hidden');
            } else {
                document.getElementById('login-form-container').classList.remove('hidden');
                document.getElementById('register-form-container').classList.add('hidden');
            }
        }

        // 載入首頁雲端店家清單
        async function loadPublicShops() {
            const grid = document.getElementById('public-shops-grid');
            const badge = document.getElementById('shop-count-badge');
            grid.innerHTML = '<p class="text-sm text-slate-400 col-span-3 text-center py-8">正在從雲端載入店家...</p>';

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "shops"));
                let shops = [];
                querySnapshot.forEach((docSnap) => {
                    shops.push({ id: docSnap.id, ...docSnap.data() });
                });

                badge.innerText = `目前共 ${shops.length} 家合作店家`;

                if (shops.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-3 text-center py-12 bg-white rounded-2xl border border-slate-100">
                            <p class="text-slate-500 mb-2">目前尚無店家註冊上線</p>
                            <button onclick="openShopLoginModal(); toggleRegisterMode(true);" class="text-rose-600 font-semibold text-sm hover:underline">立即註冊您的第一家美業工作室</button>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = shops.map(shop => `
                    <div onclick="enterCustomerShop('${shop.id}')" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md hover:border-rose-200 transition cursor-pointer flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs bg-rose-50 text-rose-600 px-2.5 py-1 rounded-full font-semibold">美業預約</span>
                                <span class="text-xs text-slate-400">試用中</span>
                            </div>
                            <h4 class="font-bold text-lg text-slate-800 mb-1">${shop.shopName || '未命名工作室'}</h4>
                            <p class="text-xs text-slate-500 mb-4"><i class="fa-solid fa-user-tie mr-1"></i>負責人：${shop.ownerName || '老闆'}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-rose-600 text-sm font-semibold">
                            <span>進入預約</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error("載入店家失敗", e);
                grid.innerHTML = `<p class="text-sm text-rose-500 col-span-3 text-center py-8">載入雲端資料發生錯誤，請檢查網路連線。</p>`;
            }
        }

        // 店家註冊處理
        async function handleShopRegister(event) {
            event.preventDefault();
            const shopName = document.getElementById('reg-shopname').value.trim();
            const ownerName = document.getElementById('reg-owner').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            const shopId = 'shop_' + Date.now(); // 產生唯一識別碼

            try {
                // 檢查帳號是否已被註冊
                const q = window.query(window.collection(window.db, "shops"), window.where("username", "==", username));
                const querySnapshot = await window.getDocs(q);
                if (!querySnapshot.empty) {
                    alert("此登入帳號已被使用，請更換其他帳號！");
                    return;
                }

                // 寫入雲端 Firestore
                const shopData = {
                    shopId,
                    shopName,
                    ownerName,
                    phone,
                    email,
                    username,
                    password,
                    createdAt: new Date().toISOString(),
                    services: [
                        { name: "精緻美睫單根嫁接", price: 1200, deposit: 300, duration: "90分鐘" },
                        { name: "無創除色 / 霧眉專屬服務", price: 2500, deposit: 500, duration: "120分鐘" }
                    ],
                    announcement: "歡迎光臨！請提前 10 分鐘到場，預約保留 10 分鐘。"
                };

                await window.setDoc(window.doc(window.db, "shops", shopId), shopData);
                
                alert("註冊成功！已為您開通前兩個月免費試用。請使用剛剛設定的帳密登入後台。");
                closeShopLoginModal();
                openShopLoginModal();
            } catch (e) {
                console.error("註冊失敗", e);
                alert("註冊發生錯誤：" + e.message);
            }
        }

        // 店家登入處理
        async function handleShopLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const q = window.query(window.collection(window.db, "shops"), window.where("username", "==", username));
                const querySnapshot = await window.getDocs(q);

                if (querySnapshot.empty) {
                    alert("找不到此登入帳號，請確認帳號是否正確或先註冊！");
                    return;
                }

                let matchedShop = null;
                querySnapshot.forEach((docSnap) => {
                    matchedShop = { id: docSnap.id, ...docSnap.data() };
                });

                if (matchedShop.password !== password) {
                    alert("密碼錯誤，請重新輸入！");
                    return;
                }

                // 登入成功
                currentLoggedInShop = matchedShop;
                closeShopLoginModal();
                enterAdminDashboard();
            } catch (e) {
                console.error("登入失敗", e);
                alert("登入發生錯誤：" + e.message);
            }
        }

        // 進入店家管理後台
        function enterAdminDashboard() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('customer-booking-view').classList.add('hidden');
            document.getElementById('shop-admin-view').classList.remove('hidden');

            document.getElementById('admin-shop-title').innerText = currentLoggedInShop.shopName + " - 管理後台";
            switchAdminTab('services');
        }

        function logoutShop() {
            currentLoggedInShop = null;
            goHome();
        }

        // 後台分頁切換
        function switchAdminTab(tabName) {
            const content = document.getElementById('admin-tab-content');
            
            if (tabName === 'services') {
                content.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 mb-1">店內純文字公告與規範</h3>
                            <p class="text-xs text-slate-400 mb-3">自訂顯示在顧客預約頁面的重要公告與注意事項</p>
                            <textarea id="admin-announcement" rows="3" class="w-full p-4 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-rose-500">${currentLoggedInShop.announcement || ''}</textarea>
                            <button onclick="saveAnnouncement()" class="mt-2 px-4 py-2 bg-rose-600 text-white rounded-xl text-sm font-semibold shadow-sm hover:bg-rose-700 transition">儲存公告</button>
                        </div>
                        <div class="border-t border-slate-100 pt-6">
                            <h3 class="font-bold text-lg text-slate-800 mb-1">服務項目設定</h3>
                            <p class="text-xs text-slate-400 mb-3">管理您的項目名稱、價格與定金</p>
                            <div id="services-list-container" class="space-y-3">
                                ${(currentLoggedInShop.services || []).map((s, idx) => `
                                    <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                        <div>
                                            <h4 class="font-bold text-slate-800">${s.name}</h4>
                                            <p class="text-xs text-slate-500">價格: $${s.price} | 定金: $${s.deposit} | 時長: ${s.duration}</p>
                                        </div>
                                        <button onclick="removeService(${idx})" class="text-rose-500 hover:text-rose-700 text-sm font-medium"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-4 p-4 bg-rose-50/50 rounded-xl border border-rose-100 grid grid-cols-1 md:grid-cols-4 gap-3">
                                <input type="text" id="new-srv-name" placeholder="服務名稱" class="p-2.5 rounded-lg border border-slate-200 text-sm">
                                <input type="number" id="new-srv-price" placeholder="價格 ($)" class="p-2.5 rounded-lg border border-slate-200 text-sm">
                                <input type="number" id="new-srv-deposit" placeholder="定金 ($)" class="p-2.5 rounded-lg border border-slate-200 text-sm">
                                <button onclick="addNewService()" class="bg-rose-600 text-white rounded-lg text-sm font-semibold hover:bg-rose-700 transition">新增服務</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'slots') {
                content.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-solid fa-calendar-days text-4xl text-slate-300 mb-3"></i>
                        <h3 class="font-bold text-lg text-slate-700">預約時段與訂單管理</h3>
                        <p class="text-xs text-slate-400 mt-1">雲端即時預約訂單與防撞時段同步功能已就緒。</p>
                    </div>
                `;
            } else if (tabName === 'accounting') {
                content.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-solid fa-wallet text-4xl text-slate-300 mb-3"></i>
                        <h3 class="font-bold text-lg text-slate-700">記帳與營收報表</h3>
                        <p class="text-xs text-slate-400 mt-1">各店家的專屬記帳與營收統計正在雲端運算中。</p>
                    </div>
                `;
            }
        }

        async function saveAnnouncement() {
            const val = document.getElementById('admin-announcement').value.trim();
            currentLoggedInShop.announcement = val;
            try {
                await window.updateDoc(window.doc(window.db, "shops", currentLoggedInShop.id), { announcement: val });
                alert("公告儲存成功！已同步至雲端。");
            } catch (e) {
                alert("儲存失敗：" + e.message);
            }
        }

        async function addNewService() {
            const name = document.getElementById('new-srv-name').value.trim();
            const price = Number(document.getElementById('new-srv-price').value);
            const deposit = Number(document.getElementById('new-srv-deposit').value);
            if (!name || !price) {
                alert("請填寫完整的服務名稱與價格！");
                return;
            }
            if (!currentLoggedInShop.services) currentLoggedInShop.services = [];
            currentLoggedInShop.services.push({ name, price, deposit: deposit || 0, duration: "60分鐘" });

            try {
                await window.updateDoc(window.doc(window.db, "shops", currentLoggedInShop.id), { services: currentLoggedInShop.services });
                switchAdminTab('services');
                alert("新增服務成功！");
            } catch (e) {
                alert("更新失敗：" + e.message);
            }
        }

        async function removeService(idx) {
            currentLoggedInShop.services.splice(idx, 1);
            try {
                await window.updateDoc(window.doc(window.db, "shops", currentLoggedInShop.id), { services: currentLoggedInShop.services });
                switchAdminTab('services');
            } catch (e) {
                alert("刪除失敗：" + e.message);
            }
        }

        // 顧客進入特定店家預約頁面
        async function enterCustomerShop(shopId) {
            currentViewingShopId = shopId;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('customer-booking-view').classList.remove('hidden');

            const banner = document.getElementById('customer-shop-banner');
            banner.innerHTML = '<p class="text-sm text-slate-400">載入店家預約頁面中...</p>';

            try {
                const docSnap = await window.getDoc(window.doc(window.db, "shops", shopId));
                if (!docSnap.exists()) {
                    alert("找不到此店家資料！");
                    goHome();
                    return;
                }
                const shop = docSnap.data();
                banner.innerHTML = `
                    <div>
                        <span class="text-xs bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full font-semibold">線上預約中</span>
                        <h2 class="text-2xl font-bold text-slate-800 mt-1">${shop.shopName}</h2>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-bullhorn mr-1 text-rose-500"></i>公告：${shop.announcement || '無公告'}</p>
                    </div>
                `;

                // 渲染預約行事曆與服務選單
                const calContainer = document.getElementById('booking-calendar-container');
                calContainer.innerHTML = `
                    <div class="space-y-4">
                        <h4 class="font-semibold text-sm text-slate-700">1. 選擇預約服務項目：</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${(shop.services || []).map((s, i) => `
                                <div class="p-4 rounded-xl border border-slate-200 hover:border-rose-500 cursor-pointer transition flex justify-between items-center">
                                    <div>
                                        <h5 class="font-bold text-slate-800">${s.name}</h5>
                                        <p class="text-xs text-slate-500">價格: $${s.price} (需付定金 $${s.deposit})</p>
                                    </div>
                                    <span class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-lg font-semibold">選擇</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (e) {
                console.error("載入預約頁面失敗", e);
            }
        }

        function previewShopPage() {
            if (currentLoggedInShop) {
                enterCustomerShop(currentLoggedInShop.id);
            }
        }

        function triggerAdminSecret() {
            const pwd = prompt("請輸入管理員總控密碼：");
            if (pwd === "Oomubook0921827360") {
                alert("管理員總控權限驗證成功！ (這裡可擴充所有店家總覽管理)");
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        }
    </script>
</body>
</html>
